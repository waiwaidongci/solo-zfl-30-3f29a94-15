<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>水下考古遗址环境监测与暴露风险台</title>
  <link rel="stylesheet" href="./src/styles.css">
</head>
<body>
  <header class="top">
    <div>
      <h1>水下考古遗址环境监测与暴露风险台</h1>
      <div class="sub">离线运行 · 数据保存在本机 · 校准修正 · 告警迟滞 · 版本化发布</div>
    </div>
    <span id="staleBadge" data-testid="stale-badge">结果已失效 · 需重算发布</span>
  </header>

  <nav class="tabs" id="tabs">
    <button data-tab="overview" class="active">总览</button>
    <button data-tab="import">数据导入</button>
    <button data-tab="registry">登记与阈值</button>
    <button data-tab="calib">校准</button>
    <button data-tab="quarantine">隔离区</button>
    <button data-tab="alerts">告警</button>
    <button data-tab="reports">报告与版本</button>
  </nav>

  <main>
    <section class="tabpage active" id="page-overview"></section>
    <section class="tabpage" id="page-import"></section>
    <section class="tabpage" id="page-registry"></section>
    <section class="tabpage" id="page-calib"></section>
    <section class="tabpage" id="page-quarantine"></section>
    <section class="tabpage" id="page-alerts"></section>
    <section class="tabpage" id="page-reports"></section>
  </main>

  <div class="toast" id="toast"></div>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
